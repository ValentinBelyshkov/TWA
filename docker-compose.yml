version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odometry-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
      - ./data/calibrations:/app/calibrations
      - ./data/projects:/app/projects
      - /opt/main/Trajectory/Database:/app/trajectory-db:rw
    environment:
      - DATABASE_URL=sqlite:///./odometry.db
      - VIDEO_SAVE_PATH=/app/uploads
      - CALIBRATION_PATH=/app/calibrations
      - PROJECTS_PATH=/app/trajectory-db/projects
      - CORS_ORIGINS=http://localhost:8080,http://localhost:3000
      - ROSBRIDGE_HOST=host.docker.internal
      - ROSBRIDGE_PORT=9091
      - TERRASLAM_GATEWAY_URL=http://host.docker.internal:9000
    env_file:
      - .env
    networks:
      - webadmin_net
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: odometry-frontend
    ports:
      - "3000:80"
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
    environment:
      - VITE_WS_URL=ws://localhost:8000
      - VITE_PUBLIC_BUILDER_KEY=${VITE_PUBLIC_BUILDER_KEY}
    depends_on:
      - backend
    networks:
      - webadmin_net
    restart: unless-stopped
    

networks:
  webadmin_net:
    driver: bridge
